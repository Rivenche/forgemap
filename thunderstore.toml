# Publishing metadata for the Thunderstore CLI.
#
# The package itself is built by package.sh, and release.yml publishes that zip
# with `tcli publish --file`, so [build] below is unused -- manifest.json inside
# the zip is what Thunderstore actually reads. versionNumber is likewise passed
# on the command line from manifest.json, which stays the single source of truth.

[config]
schemaVersion = "0.0.1"

[package]
namespace = "ForgeServer"   # the Thunderstore team: to confirm before the first upload
name = "ForgeMap"
versionNumber = "0.0.0"
description = "Live web map for Valheim dedicated servers, in French and English."
websiteUrl = "https://forgeserver.fr"
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = "5.4.2350"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./dist"

[publish]
repository = "https://thunderstore.io"
communities = [ "valheim" ]

[publish.categories]
valheim = [ "server-side", "utility", "tools" ]
